name: Get versions
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get versions
        run: |
          set -xe

          sudo apt update
          sudo apt install git

          #We want to start in this repo
          git clone https://${{secrets.PAT_TOKEN}}@github.com/GlobalPathogenAnalysisService/gpas-tb-workflow.git
          cd gpas-tb-workflow
          git checkout add-software-versions


          #Change IFS so we only interpret newlines as splits for `for` loops
          DEFAULT_IFS=$(echo $IFS)
          IFS=$'\n'

          #Variable interpolation is a bit weird here - for some reason, $command is always produced
          # surrounded by single quotes which cannot be removed with `tr`.
          #So to get this to work, we build a string based on `sudo docker run` to include the container,
          # version and command, and then eval it
          DOCKER_RUN="sudo docker run "

          for container in $(cat get-software-version-commands.json | jq "keys[]");
          do
            #TODO: get container tag out of container_versions.txt
            TAG="latest"
            for command in $(cat get-software-version-commands.json | jq ".${container}[]");
            do
              IFS=$(echo $DEFAULT_IFS)
              # command=${command//\'/}
              DOCKER_RUN+="$(echo $container | tr -d \"):latest $(echo $command | tr -d \")"
              eval $DOCKER_RUN
              DOCKER_RUN="sudo docker run "
              IFS=$'\n'
            done
          done

          IFS=$(echo $DEFAULT_IFS)
          sudo docker run lhr.ocir.io/lrbvkel2wjot/oxfordmmm/fn5:latest fn5 --version



